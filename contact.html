<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;
    font-family:Tahoma,sans-serif;
    background:
    linear-gradient(135deg,#80cbc4,#e0f2f1);

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

}

/* แสงพื้นหลัง */

body::before{

    content:"";
    position:absolute;

    width:500px;
    height:500px;

    background:white;

    opacity:.25;

    border-radius:50%;

    filter:blur(80px);

    top:10%;
    left:10%;

}

/* ใบไม้ */

.leaf{

    position:absolute;

    font-size:45px;

    color:white;

    opacity:.8;

    text-shadow:0 0 10px white;

    animation:leafMove linear infinite;

}

.leaf:nth-child(1){

    left:5%;
    animation-duration:10s;

}

.leaf:nth-child(2){

    left:20%;
    animation-duration:14s;
    font-size:35px;

}

.leaf:nth-child(3){

    left:40%;
    animation-duration:11s;
    font-size:55px;

}

.leaf:nth-child(4){

    left:65%;
    animation-duration:15s;

}

.leaf:nth-child(5){

    left:85%;
    animation-duration:12s;
    font-size:40px;

}

@keyframes leafMove{

0%{

top:110%;

transform:
translateX(0)
rotate(0deg);

}

25%{

transform:
translateX(50px)
rotate(90deg);

}

50%{

transform:
translateX(-50px)
rotate(180deg);

}

75%{

transform:
translateX(50px)
rotate(270deg);

}

100%{

top:-20%;

transform:
translateX(0)
rotate(360deg);

}

}

/* กล่อง */

.container{

    width:850px;
    max-width:90%;

    background:rgba(255,255,255,.92);

    border-radius:35px;

    padding:40px;

    text-align:center;

    position:relative;

    z-index:2;

    box-shadow:0 20px 40px rgba(0,0,0,.25);

    animation:show 1s;

}

@keyframes show{

from{

opacity:0;

transform:
translateY(40px)
scale(.9);

}

to{

opacity:1;

transform:
translateY(0)
scale(1);

}

}

h1{

    color:#00695c;

    font-size:40px;

    margin-bottom:10px;

    text-shadow:0 3px 5px rgba(0,0,0,.15);

}

.subtitle{

    color:#555;

    margin-bottom:30px;

    font-size:18px;

}

/* กล่องข้อมูล */

.contact-box{

    background:
    linear-gradient(135deg,#e0f2f1,#ffffff);

    padding:20px;

    border-radius:25px;

    box-shadow:
    inset 0 0 15px rgba(38,166,154,.2);

}

/* การ์ด */

.card{

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:white;

    padding:18px 25px;

    border-radius:18px;

    margin:18px 0;

    box-shadow:0 8px 18px rgba(0,0,0,.12);

    transition:.35s;

}

.card:hover{

    transform:translateY(-6px);

    box-shadow:0 15px 25px rgba(0,0,0,.2);

}

.left{

    display:flex;

    align-items:center;

    gap:18px;

    font-size:20px;

    color:#333;

}

.icon{

    font-size:35px;

}

.value{

    font-weight:bold;

}

.open{

    background:#26a69a;

    color:white;

    padding:10px 22px;

    border-radius:25px;

    text-decoration:none;

    transition:.3s;

    font-weight:bold;

}

.open:hover{

    background:#00695c;

}

/* ปุ่มกลับ */

.back{

    display:inline-block;

    margin-top:30px;

    padding:14px 35px;

    background:#26a69a;

    color:white;

    text-decoration:none;

    border-radius:30px;

    font-weight:bold;

    transition:.3s;

    box-shadow:0 8px 15px rgba(0,0,0,.25);

}

.back:hover{

    background:#00695c;

    transform:translateY(-6px);

    box-shadow:0 15px 25px rgba(0,0,0,.35);

}

@media(max-width:700px){

.card{

flex-direction:column;

gap:15px;

text-align:center;

}

.left{

flex-direction:column;

}

}

</style>
