<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,sans-serif;
    background:linear-gradient(135deg,#80cbc4,#e0f2f1);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}


/* ======================
   ใบไม้ลอย
====================== */

.leaf{
    position:fixed;
    top:-50px;
    color:white;
    font-size:35px;
    opacity:0.8;
    pointer-events:none;
    z-index:1;
    text-shadow:
    0 0 10px white;

    animation:fall linear infinite;
}


@keyframes fall{

    0%{
        transform:
        translateY(-50px)
        translateX(0)
        rotate(0deg);
        opacity:0;
    }


    10%{
        opacity:1;
    }


    50%{
        transform:
        translateY(50vh)
        translateX(50px)
        rotate(180deg);
    }


    100%{
        transform:
        translateY(110vh)
        translateX(-50px)
        rotate(360deg);
        opacity:0;
    }

}



.leaf:nth-child(1){
    left:5%;
    animation-duration:10s;
}

.leaf:nth-child(2){
    left:15%;
    animation-duration:14s;
    font-size:45px;
}

.leaf:nth-child(3){
    left:25%;
    animation-duration:9s;
}

.leaf:nth-child(4){
    left:35%;
    animation-duration:13s;
    font-size:50px;
}

.leaf:nth-child(5){
    left:45%;
    animation-duration:11s;
}

.leaf:nth-child(6){
    left:55%;
    animation-duration:15s;
    font-size:40px;
}

.leaf:nth-child(7){
    left:65%;
    animation-duration:10s;
}

.leaf:nth-child(8){
    left:75%;
    animation-duration:12s;
    font-size:48px;
}

.leaf:nth-child(9){
    left:85%;
    animation-duration:9s;
}

.leaf:nth-child(10){
    left:95%;
    animation-duration:14s;
}


/* กล่องหลัก */

.container{
    width:1000px;
    max-width:90%;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(10px);
    border-radius:30px;
    padding:50px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,0.25);

    position:relative;
    z-index:5;

    animation:show 1s;
}



@keyframes show{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}



/* รูปโปรไฟล์ */

.profile-img{
    width:250px;
    height:250px;
    border-radius:50%;
    object-fit:cover;

    border:8px solid #26a69a;

    box-shadow:
    0 0 20px #26a69a,
    0 10px 25px rgba(0,0,0,0.3);
}



/* หัวข้อ */

h1{
    color:#00695c;
    font-size:42px;
    margin-top:25px;
    text-shadow:
    0 3px 5px rgba(0,0,0,0.15);
}


h2{
    color:#00897b;
    font-size:28px;
}


p{
    font-size:22px;
    color:#444;
}



/* เมนู */

.menu{
    margin-top:40px;
    display:flex;
    justify-content:center;
    gap:20px;
}


.menu a{
    width:190px;
    padding:18px 10px;

    background:#26a69a;

    color:white;

    text-decoration:none;

    border-radius:25px;

    font-size:18px;

    font-weight:bold;

    box-shadow:
    0 8px 15px rgba(0,0,0,0.25);

    transition:.4s;
}



.menu a:hover{

    background:#00695c;

    transform:
    translateY(-10px)
    scale(1.05);

    box-shadow:
    0 15px 25px rgba(0,0,0,0.35);

}



/* รองรับมือถือ */

@media(max-width:800px){

    .menu{
        flex-direction:column;
    }


    .menu a{
        width:100%;
    }

}
