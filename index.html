<title>Portfolio สุรัสวดี วิเศษศรี</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,sans-serif;
    background:linear-gradient(135deg,#80cbc4,#e0f2f1);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}


/* กล่องหลัก */

.container{
    width:1000px;
    max-width:90%;
    background:white;
    border-radius:30px;
    padding:50px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,0.25);
}


/* รูปโปรไฟล์ */

.profile-img{
    width:250px;
    height:250px;
    border-radius:50%;
    object-fit:cover;
    border:8px solid #26a69a;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}



/* หัวข้อ */

h1{
    color:#00695c;
    font-size:42px;
    margin-top:25px;
}


h2{
    color:#00897b;
    font-size:28px;
}


p{
    font-size:22px;
    color:#444;
}



/* เมนู */

.menu{
    margin-top:40px;
    display:flex;
    justify-content:center;
    gap:20px;
}


.menu a{
    width:190px;
    padding:18px 10px;
    background:#26a69a;
    color:white;
    text-decoration:none;
    border-radius:25px;
    font-size:18px;
    font-weight:bold;
    box-shadow:0 8px 15px rgba(0,0,0,0.25);
    transition:0.3s;
}


.menu a:hover{
    background:#00695c;
    transform:translateY(-8px);
    box-shadow:0 15px 25px rgba(0,0,0,0.35);
}



/* รองรับมือถือ */

@media(max-width:800px){

    .menu{
        flex-direction:column;
    }


    .menu a{
        width:100%;
    }

}

</style>

</head>
