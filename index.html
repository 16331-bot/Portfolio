    <style>
        body{

        .container{

        }

        }

        .menu a{
            text-decoration:none;
            background:#26a69a;
            color:white;
            padding:12px 22px;
            margin:8px;
            border-radius:30px;
            display:inline-block;
            font-size:18px;
            font-weight:bold;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
            transition:0.3s;
        }

        .menu a:hover{
            background:#00695c;
            transform:translateY(-3px);
        }
