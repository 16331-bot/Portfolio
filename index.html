<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio สุรัสวดี วิเศษศรี</title>

    <style>
        body{
            margin:0;
            font-family:Tahoma,sans-serif;
            background:linear-gradient(to right,#80cbc4,#b2dfdb);
        }

        .container{
            width:1000px;
            max-width:90%;
            margin:40px auto;
            background:white;
            border-radius:25px;
            padding:40px;
            text-align:center;
            box-shadow:0 8px 20px rgba(0,0,0,0.25);
        }

        /* กรอบรูป */
        .photo{
            display:inline-block;
            padding:10px;
            background:white;
            border-radius:50%;
            box-shadow:0 8px 20px rgba(0,0,0,0.25);
        }

        img{
            width:220px;
            height:220px;
            border-radius:50%;
            border:6px solid #26a69a;
            object-fit:cover;
        }

        h1{
            color:#00695c;
            margin-top:25px;
            font-size:36px;
        }

        h2{
            color:#00695c;
        }

        p{
            font-size:22px;
            color:#444;
            margin:8px;
        }

        /* เมนู */
        .menu{
            margin-top:35px;
            display:flex;
            justify-content:center;
            align-items:center;
            gap:15px;
        }

        .menu a{
            width:180px;
            text-align:center;
            text-decoration:none;
            background:#26a69a;
            color:white;
            padding:15px 0;
            border-radius:30px;
            font-size:18px;
            font-weight:bold;
            box-shadow:0 5px 12px rgba(0,0,0,0.25);
            transition:all 0.3s ease;
        }

        /* เอฟเฟกต์เมาส์ชี้ */
        .menu a:hover{
            background:#00695c;
            transform:translateY(-5px);
            box-shadow:0 10px 20px rgba(0,0,0,0.35);
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="photo">
            <img src="images/Screenshot 2026-06-24 112036.png" alt="รูปภาพของสุรัสวดี">
        </div>

        <h1>🌿 Portfolio 🌿</h1>

        <h2>นางสาวสุรัสวดี วิเศษศรี</h2>

        <p>🎓 นักเรียนชั้นมัธยมศึกษาปีที่ 6/1</p>
        <p>🏫 โรงเรียนพานทอง</p>

        <div class="menu">
            <a href="profile.html">👤 ประวัติส่วนตัว</a>
            <a href="education.html">📚 ประวัติการศึกษา</a>
            <a href="award.html">🏆 ผลงาน</a>
            <a href="contact.html">📞 ช่องทางการติดต่อ</a>
        </div>

    </div>

</body>
</html>
